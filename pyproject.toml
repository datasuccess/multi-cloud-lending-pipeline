[project]
name = "multi-cloud-lending-pipeline"
version = "0.0.1"
description = "End-to-end ELT pipeline for a consumer-lending platform across Redshift, Snowflake, and BigQuery on a shared Iceberg lakehouse."
requires-python = ">=3.11"
readme = "README.md"

# Per-phase dependencies are added as the phases land.
# Phase 1: Lambda generator stack (pyarrow + Faker + Powertools).
dependencies = [
    "pyarrow>=16,<17",
    "faker>=25,<26",
    "aws-lambda-powertools>=2.30",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest>=8",
]
# Local-only stack for the monitoring app — never bundled into the Lambda zip.
streamlit = [
    "streamlit>=1.32",
    "pandas>=2.1",
    "plotly>=5.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
